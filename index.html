
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primary Subject Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">📚 <span>Primary<span class="accent">Helper</span></span></div>
    <button id="themeBtn" class="theme-btn" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main class="container">
    <section class="hero">
      <span class="tag">🎓 YOUR LEARNING ADVENTURE</span>
      <h1>Learn better.<br><span class="accent">Shine brighter!</span></h1>
      <p>Choose your class, pick a subject, and start learning at your own pace.</p>
    </section>

    <section class="setup card">
      <h2>🚀 Let's get started!</h2>

      <div class="field">
        <label for="classSelect">Your class</label>
        <select id="classSelect">
          <option value="1">Primary 1</option>
          <option value="2">Primary 2</option>
          <option value="3">Primary 3</option>
          <option value="4">Primary 4</option>
          <option value="5">Primary 5</option>
          <option value="6">Primary 6</option>
        </select>
      </div>

      <div class="field">
        <label for="ageSelect">Your age</label>
        <select id="ageSelect">
          <option value="5">5 years old</option>
          <option value="6">6 years old</option>
          <option value="7">7 years old</option>
          <option value="8">8 years old</option>
          <option value="9">9 years old</option>
          <option value="10" selected>10 years old</option>
          <option value="11">11 years old</option>
          <option value="12">12 years old</option>
          <option value="13">13 years old</option>
        </select>
      </div>

      <div class="field">
        <label for="subjectSelect">Choose a subject</label>
        <select id="subjectSelect">
          <option value="maths">🔢 Mathematics</option>
          <option value="english">📖 English Language</option>
          <option value="science">🔬 Basic Science</option>
          <option value="phe">⚽ Physical & Health Education</option>
          <option value="agric">🌱 Agricultural Science</option>
        </select>
      </div>

      <div class="field">
        <label for="levelSelect">Choose your difficulty</label>
        <select id="levelSelect">
          <option value="Beginner">🌱 Beginner</option>
          <option value="Easy">⭐ Easy</option>
          <option value="Medium">🔥 Medium</option>
        </select>
      </div>

      <button id="startBtn" class="primary-btn">Start Learning 🚀</button>
    </section>

    <section id="lessonSection" class="card lesson hidden" aria-live="polite">
      <span id="lessonTag" class="tag">YOUR LESSON</span>
      <h2 id="lessonTitle">Welcome!</h2>
      <p id="lessonInfo" class="lesson-info"></p>
      <div id="lessonContent" class="lesson-content"></div>
      <div id="quizArea"></div>
      <p id="feedback" class="feedback" role="status"></p>
      <button id="checkBtn" class="primary-btn">Check Answer ✓</button>
      <button id="nextBtn" class="secondary-btn hidden">Try Another Question ➜</button>
    </section>

    <footer>Made for young learners 💙 Keep practising and keep shining!</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
